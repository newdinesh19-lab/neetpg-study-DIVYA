const QB=[
['anes','A single induction dose of which IV agent is notable for transient adrenocortical suppression?',['Propofol','Ketamine','Etomidate','Thiopentone'],2,'Etomidate inhibits 11β-hydroxylase and lowers cortisol synthesis even after one dose; it is chosen for haemodynamic stability. Propofol, ketamine and thiopentone do not inhibit steroidogenesis.',"Its cardiovascular stability is the textbook reason to use it; the adrenal effect is the textbook catch.",2],
['anes','Which inhalational agent has the lowest blood:gas partition coefficient (fastest onset and offset)?',['Nitrous oxide','Desflurane','Sevoflurane','Isoflurane'],1,'Desflurane ≈ 0.42, nitrous oxide ≈ 0.47, sevoflurane ≈ 0.69, isoflurane ≈ 1.4.','Nitrous oxide is a very close second and is often chosen wrongly.',3],
['anes','Dantrolene, used in malignant hyperthermia, acts by blocking:',['Dihydropyridine receptor','Ryanodine receptor (RyR1)','SERCA pump','NMDA receptor'],1,'Dantrolene inhibits calcium release from the sarcoplasmic reticulum through RyR1, stopping the hypermetabolic contraction. The DHP receptor is the voltage sensor that triggers RyR1, not the drug target.','DHPR vs RyR1 confusion.',2],
['anes','For severe local anaesthetic systemic toxicity, the initial bolus of 20% lipid emulsion is:',['0.5 mL/kg','1.5 mL/kg','5 mL/kg','10 mL/kg'],1,'1.5 mL/kg bolus followed by an infusion (about 15 mL/kg/h). Other steps: stop the injection, call for help, airway/oxygen, treat seizures, use small epinephrine doses if needed.','Remember the infusion after the bolus.',2],
['anes','Sugammadex reverses neuromuscular blockade by encapsulating:',['Succinylcholine','Atracurium','Rocuronium','Mivacurium'],2,'A modified γ-cyclodextrin that binds aminosteroid blockers (rocuronium > vecuronium). It does not reverse benzylisoquinolines such as atracurium or succinylcholine.','Neostigmine inhibits an enzyme; sugammadex encapsulates the drug.',1],
['anes','The most reliable confirmation of correct endotracheal tube placement is:',['Chest auscultation','Pulse oximetry','Continuous capnography (EtCO₂ waveform)','Chest X-ray'],2,'A sustained end-tidal CO₂ waveform confirms tracheal placement. Auscultation and SpO₂ can mislead and SpO₂ lags; an X-ray checks depth, not trachea vs oesophagus.','Absent EtCO₂ with a tube in place means oesophageal intubation until proven otherwise (or no circulation).',1],
['pharm','A 9-year-old has absence seizures and generalised tonic-clonic seizures. The most appropriate single drug is:',['Ethosuximide','Sodium valproate','Carbamazepine','Phenytoin'],1,'Valproate covers both seizure types. Ethosuximide covers absence only; carbamazepine and phenytoin can worsen absence seizures.','Ethosuximide is the choice for pure absence, not mixed seizures.',2],
['pharm','Rifampicin acts by inhibiting:',['DNA gyrase','DNA-dependent RNA polymerase','Arabinosyl transferase','Mycolic acid synthesis'],1,'Rifampicin binds the β-subunit of bacterial RNA polymerase. DNA gyrase = fluoroquinolones; arabinosyl transferase = ethambutol; mycolic acid synthesis = isoniazid.','Match each antitubercular drug to its target.',1],
['pharm','Which drug most likely DECREASES the anticoagulant effect of warfarin?',['Amiodarone','Metronidazole','Rifampicin','Fluconazole'],2,'Rifampicin induces CYP enzymes and increases warfarin clearance. The others inhibit its metabolism and raise the INR.','Inducers lower the effect; inhibitors raise it.',1],
['pharm','Rescue therapy after high-dose methotrexate uses:',['Leucovorin (folinic acid)','Folic acid','Mesna','Amifostine'],0,'Folinic acid bypasses the DHFR block. Folic acid needs DHFR so is ineffective; mesna protects the bladder from cyclophosphamide/ifosfamide; amifostine is for cisplatin nephrotoxicity and radiation xerostomia.','Folic acid vs folinic acid.',2],
['pharm','The dose-limiting toxicity of bleomycin is:',['Cardiomyopathy','Pulmonary fibrosis','Haemorrhagic cystitis','Myelosuppression'],1,'Bleomycin is relatively marrow-sparing; pulmonary fibrosis limits dose (risk rises with cumulative dose, high FiO₂, radiotherapy). Cardiomyopathy = doxorubicin; haemorrhagic cystitis = cyclophosphamide.','Avoid high FiO₂ in patients treated with bleomycin.',1],
['phys','Which of the following shifts the oxygen–haemoglobin dissociation curve to the LEFT?',['Acidosis','Fetal haemoglobin','Increased 2,3-BPG','Fever'],1,'HbF binds 2,3-BPG poorly, so oxygen affinity rises (left shift). Acidosis (Bohr effect), raised 2,3-BPG and fever shift it right.','Left = higher affinity, lower P50.',1],
['phys','Inulin: plasma 0.5 mg/mL, urine 30 mg/mL, urine flow 2 mL/min. The GFR is:',['30 mL/min','60 mL/min','120 mL/min','240 mL/min'],2,'GFR = (U × V) / P = (30 × 2) / 0.5 = 120 mL/min.','Do not forget to divide by plasma concentration.',2],
['phys','Heart rate 75/min, end-diastolic volume 120 mL, end-systolic volume 50 mL. Cardiac output is:',['3.75 L/min','5.25 L/min','9.0 L/min','7.0 L/min'],1,'Stroke volume = 120 − 50 = 70 mL; CO = 70 × 75 = 5,250 mL/min ≈ 5.25 L/min.','Using ESV or EDV instead of the difference gives the wrong options.',1],
['micro','A Gram-positive bacillus shows tumbling motility at 25 °C and grows at 4 °C. It is:',['Listeria monocytogenes','Clostridium perfringens','Bacillus anthracis','Corynebacterium diphtheriae'],0,'Listeria: tumbling motility at 25 °C, umbrella motility in semisolid agar, cold enrichment. The other three are non-motile.','Motility at 25 °C but not 37 °C is the clue.',1],
['micro','Which drug kills the hypnozoites of Plasmodium vivax?',['Chloroquine','Artesunate','Primaquine','Quinine'],2,'Primaquine (or tafenoquine) is hypnozoitocidal and gives radical cure. The others act on blood stages.','Test G6PD status before primaquine or tafenoquine.',1],
['micro','HBsAg negative, anti-HBc negative, anti-HBs positive indicates:',['Chronic infection','Immunity from vaccination','Window period','Immunity from past infection'],1,'The vaccine contains HBsAg only, so only anti-HBs develops. Past infection also produces anti-HBc.','Anti-HBc separates infection from vaccination.',2],
['path','The translocation t(15;17) (PML-RARA) is associated with a leukaemia that responds to:',['All-trans retinoic acid','Imatinib','Rituximab','Hydroxyurea'],0,'This is acute promyelocytic leukaemia (AML-M3). ATRA and arsenic trioxide induce differentiation. Imatinib targets BCR-ABL, t(9;22).','Watch for DIC at presentation.',1],
['path','The RB1 (retinoblastoma) gene is located on chromosome:',['11p','13q14','17p13','5q21'],1,'RB1 is at 13q14; WT1 at 11p13; TP53 at 17p13; APC at 5q21.','Match gene to locus.',2],
['path','Goodpasture syndrome is an example of which hypersensitivity reaction?',['Type I','Type II','Type III','Type IV'],1,'Antibodies against the α3 chain of type IV collagen (a fixed tissue antigen) = type II. Type III is immune-complex disease (SLE, PSGN).','Linear (not granular) IF pattern points to type II.',1],
['path','Which finding is typical of iron deficiency anaemia?',['Low TIBC','High TIBC','High ferritin','Normal serum iron'],1,'Low iron raises transferrin, so TIBC is high; ferritin, serum iron and transferrin saturation fall. Anaemia of chronic disease: low TIBC, high ferritin.','Ferritin is an acute-phase reactant and can mislead in inflammation.',2],
['psm','Screening results: TP 90, FN 10, FP 20, TN 80. The positive predictive value is:',['90%','80%','81.8%','88.9%'],2,'PPV = TP/(TP+FP) = 90/110 = 81.8%. 90% is sensitivity, 80% specificity, 88.9% the NPV (80/90).','Predictive values change with prevalence; sensitivity and specificity do not.',2],
['psm','The measure of association calculated in a case-control study is:',['Relative risk','Odds ratio','Attributable risk','Incidence rate ratio'],1,'Case-control studies start from outcome, so incidence cannot be measured; the odds ratio is used.','Relative risk comes from cohort studies.',1],
['psm','The best measure of central tendency for positively skewed data (e.g. length of hospital stay) is:',['Mean','Median','Range','Standard deviation'],1,'Extreme values pull the mean; the median is robust to skew. Range and SD are measures of dispersion.','Range and SD are not central tendency measures.',1],
['med','The earliest ECG change of hyperkalaemia is:',['Prolonged PR interval','Tall peaked T waves','Wide QRS complex','Sine-wave pattern'],1,'Peaked T waves appear first, then PR prolongation, P wave loss, QRS widening and a sine-wave pattern. Treat with IV calcium gluconate for ECG changes.','Calcium stabilises the membrane; it does not lower potassium.',1],
['med','Kussmaul sign (JVP rises on inspiration) is classically seen in:',['Cardiac tamponade','Constrictive pericarditis','Aortic stenosis','Mitral stenosis'],1,'Constriction prevents the normal fall in right-atrial pressure with inspiration. Pulsus paradoxus is the sign of tamponade.','Kussmaul = constriction; pulsus paradoxus = tamponade.',2],
['med','In DKA, insulin infusion should be held until serum potassium is above:',['2.5 mEq/L','3.3 mEq/L','4.5 mEq/L','5.5 mEq/L'],1,'If K⁺ < 3.3 mEq/L, replace potassium first (insulin drives K⁺ into cells and can cause arrhythmia). From 3.3–5.3 give insulin with potassium replacement.','Total body K⁺ is depleted even when serum K⁺ looks normal.',2],
['obg','The earliest clinical sign of magnesium sulphate toxicity is:',['Respiratory depression','Loss of patellar reflex','Cardiac arrest','Oliguria'],1,'Deep tendon reflexes are lost first, followed by respiratory depression at higher levels and cardiac arrest at still higher levels. Antidote: 10% calcium gluconate IV.','Check reflexes, respiratory rate and urine output before each dose.',1],
['obg','Which uterotonic is relatively contraindicated in asthma?',['Oxytocin','Methylergometrine','Carboprost','Misoprostol'],2,'Carboprost (15-methyl PGF2α) can cause bronchospasm. Methylergometrine is avoided in hypertension and pre-eclampsia.','Each second-line drug has its own contraindication.',2],
['ped','Jaundice appearing within the first 24 hours of life is:',['Physiological','Always pathological until proven otherwise','Breast-milk jaundice','Due to Crigler–Najjar syndrome'],1,'Physiological jaundice appears after 24 hours. Jaundice within 24 hours suggests haemolysis (Rh/ABO incompatibility, G6PD deficiency) and needs urgent work-up. Breast-milk jaundice appears after the first week.','Timing of onset is the key discriminator.',1],
['ped','BCG vaccine in newborns is given:',['Intradermally over the left upper arm','Subcutaneously over the right thigh','Intramuscularly in the anterolateral thigh','Intradermally over the right gluteal region'],0,'Intradermal injection at the left deltoid insertion; a papule forms, ulcerates and heals with a scar. The anterolateral thigh is the IM site for most other infant vaccines.','Never give BCG subcutaneously.',1],
['anat','Winged scapula results from injury to the:',['Axillary nerve','Long thoracic nerve','Thoracodorsal nerve','Suprascapular nerve'],1,'The long thoracic nerve (C5–C7) supplies serratus anterior; it is at risk in axillary dissection.','Thoracodorsal supplies latissimus dorsi.',1],
['anat','A fracture of the surgical neck of the humerus endangers the:',['Radial nerve','Axillary nerve','Musculocutaneous nerve','Ulnar nerve'],1,'The axillary nerve and posterior circumflex humeral artery wind around the surgical neck. The radial nerve is at risk in shaft fractures.','Surgical neck = axillary; mid-shaft = radial.',1],
['bio','Which enzyme is deficient in von Gierke disease?',['Glucose-6-phosphatase','Debranching enzyme','Muscle glycogen phosphorylase','Acid α-glucosidase'],0,'GSD type I: fasting hypoglycaemia, lactic acidosis, hyperuricaemia, hyperlipidaemia, hepatomegaly. Cori = debranching, McArdle = muscle phosphorylase, Pompe = acid maltase.','Lactic acidosis separates type I from other hepatic GSDs.',1],
['bio','Erythrocyte transketolase activity is used to assess deficiency of:',['Thiamine','Riboflavin','Pyridoxine','Niacin'],0,'Transketolase needs thiamine pyrophosphate. Riboflavin status uses glutathione reductase; pyridoxine uses transaminase activity.','The functional "TPP effect" test is more useful than serum levels.',2],
['surg','A 70 kg adult has 40% TBSA burns. By the Parkland formula, crystalloid in the first 8 hours (from the time of burn) is about:',['2,800 mL','5,600 mL','11,200 mL','8,400 mL'],1,'4 mL × 70 kg × 40 = 11,200 mL in 24 h; half (5,600 mL) in the first 8 h. Titrate to urine output of 0.5–1 mL/kg/h.','11,200 mL is the 24-hour total.',2],
['oph','According to national blindness surveys, the leading cause of blindness in India is:',['Glaucoma','Cataract','Refractive error','Corneal opacity'],1,'Cataract is the leading cause of blindness; uncorrected refractive error is the leading cause of visual impairment. Verify against the latest NPCBVI data.','Blindness vs visual impairment have different leading causes.',1],
['ent','The commonest site of anterior epistaxis is:',["Woodruff's plexus","Little's area (Kiesselbach plexus)",'Sphenopalatine foramen','Inferior turbinate'],1,"Little's area on the anterior nasal septum. Woodruff's plexus is the usual site of posterior bleeds.",'Anterior vs posterior sites.',1],
['psy','The usual therapeutic serum level of lithium is about:',['0.1–0.3 mEq/L','0.6–1.2 mEq/L','1.5–2.5 mEq/L','2.5–3.5 mEq/L'],1,'Narrow therapeutic index; toxicity above about 1.5 mEq/L. Thiazides, NSAIDs and ACE inhibitors raise levels.','Check levels about 12 h after the last dose.',1],
['derm','The target antigen in bullous pemphigoid is:',['Desmoglein 3','BP180 (collagen XVII)','Desmoglein 1','Collagen VII'],1,'BP180/BP230 are hemidesmosomal proteins: subepidermal blisters, Nikolsky negative. Dsg3 = pemphigus vulgaris, Dsg1 = pemphigus foliaceus, collagen VII = epidermolysis bullosa acquisita.','Depth of the split decides the disease.',2],

['phys','Which part of the cardiac conduction system conducts most slowly?','AV node',['SA node','Bundle of His','Purkinje fibres'],'The AV node delays the impulse by about 0.1 s so the ventricles can fill before they contract.','Purkinje fibres conduct fastest, not slowest.',1,'CARDIOVASCULAR'],
['phys','According to the Frank–Starling mechanism, stroke volume increases when which of these increases?','End-diastolic volume (preload)',['Heart rate alone','Systemic vascular resistance','Aortic valve area'],'Greater ventricular filling stretches the sarcomeres and increases force of contraction, within physiological limits.','Heart rate changes cardiac output, but it is not the Starling mechanism.',1,'CARDIOVASCULAR'],
['phys','The oxygen–haemoglobin dissociation curve shifts to the right with:','Increased 2,3-BPG',['Fetal haemoglobin','Hypothermia','Alkalosis'],'Rise in 2,3-BPG, H+, PCO2 and temperature lowers Hb affinity for O2 (right shift) and favours unloading in tissues.','Fetal Hb has lower affinity for 2,3-BPG, so its curve is shifted LEFT.',2,'RESPIRATORY'],
['phys','The most important direct stimulus of the central chemoreceptors is:','H+ concentration in CSF/brain interstitial fluid',['Fall in arterial PO2','Fall in plasma bicarbonate','Rise in plasma K+'],'CO2 crosses the blood–brain barrier and raises H+ in CSF, which drives ventilation. Peripheral chemoreceptors respond to low PO2.','Hypoxia acts mainly through peripheral (carotid) chemoreceptors.',2,'RESPIRATORY'],
['phys','Which substance gives the most accurate measurement of GFR?','Inulin',['Creatinine','Para-aminohippuric acid','Urea'],'Inulin is freely filtered and neither secreted nor reabsorbed. Creatinine is used clinically but is slightly secreted.','PAH measures renal plasma flow, not GFR.',2,'RENAL'],
['phys','Most of the filtered sodium is reabsorbed in the:','Proximal convoluted tubule',['Loop of Henle','Distal convoluted tubule','Collecting duct'],'About 65% of filtered Na+ and water is reabsorbed in the PCT, isosmotically.','The collecting duct fine-tunes sodium but handles only a small fraction.',1,'RENAL'],
['phys','Which hormone is released from the posterior pituitary?','Oxytocin',['ACTH','Prolactin','Growth hormone'],'Oxytocin and ADH are synthesised in the hypothalamus and stored/released from the posterior pituitary.','All the other options are anterior pituitary hormones.',1,'ENDOCRIN'],
['phys','Prolactin secretion is mainly controlled by:','Inhibition by dopamine',['Stimulation by GHRH','Inhibition by TRH','Stimulation by somatostatin'],'Hypothalamic dopamine tonically inhibits prolactin, so cutting the stalk raises prolactin (unlike other pituitary hormones).','TRH can stimulate prolactin; it does not inhibit it.',2,'ENDOCRIN'],
['phys','The Golgi tendon organ senses:','Muscle tension',['Muscle length','Joint position only','Rate of change of muscle length'],'Golgi tendon organs lie in series with muscle fibres and signal tension, producing the inverse myotatic reflex.','Muscle spindles sense length and its rate of change.',2,'NEURO'],
['phys','Vision in dim light (scotopic vision) is mediated by:','Rods',['Cones','Ganglion cells only','Bipolar cells only'],'Rods contain rhodopsin and are highly sensitive but give no colour or fine detail.','Photoreceptors hyperpolarise in light and depolarise in the dark.',1,'SPECIAL'],
['bio','A competitive inhibitor of an enzyme causes:','Increased Km with unchanged Vmax',['Decreased Km with decreased Vmax','Unchanged Km with decreased Vmax','Decreased Km with unchanged Vmax'],'Competitive inhibition can be overcome by more substrate, so Vmax is unchanged but more substrate is needed to reach half Vmax (higher Km).','Non-competitive inhibition lowers Vmax and leaves Km unchanged.',2,'ENZYMES'],
['bio','The rate-limiting enzyme of glycolysis is:','Phosphofructokinase-1',['Hexokinase','Pyruvate kinase','Aldolase'],'PFK-1 is activated by fructose-2,6-bisphosphate and AMP and inhibited by ATP and citrate.','Hexokinase and pyruvate kinase are also regulated, but PFK-1 is the main control point.',1,'CARBOHYDRATE'],
['bio','Which enzyme is unique to gluconeogenesis?','Fructose-1,6-bisphosphatase',['Hexokinase','Phosphofructokinase-1','Pyruvate kinase'],'The unique gluconeogenic enzymes are pyruvate carboxylase, PEPCK, fructose-1,6-bisphosphatase and glucose-6-phosphatase.','The other three are glycolytic enzymes.',2,'CARBOHYDRATE'],
['bio','Von Gierke disease is due to deficiency of:','Glucose-6-phosphatase',['Muscle glycogen phosphorylase','Acid maltase','Debranching enzyme'],'Fasting hypoglycaemia, hepatomegaly, lactic acidosis and hyperuricaemia result from failure to release glucose from G6P.','McArdle disease is muscle phosphorylase deficiency; Pompe is acid maltase deficiency.',2,'CARBOHYDRATE'],
['bio','The rate-limiting step of cholesterol synthesis is catalysed by:','HMG-CoA reductase',['HMG-CoA synthase','Acetyl-CoA carboxylase','Lipoprotein lipase'],'Statins inhibit HMG-CoA reductase, which converts HMG-CoA to mevalonate.','Acetyl-CoA carboxylase is the rate-limiting enzyme of fatty-acid synthesis.',1,'LIPID'],
['bio','Carnitine palmitoyltransferase-I is needed to transport which substance into mitochondria?','Long-chain fatty acids',['Pyruvate','Cholesterol','Short-chain fatty acids'],'The carnitine shuttle carries long-chain acyl groups across the inner mitochondrial membrane for beta-oxidation.','Short and medium chain fatty acids cross without the carnitine shuttle.',2,'LIPID'],
['bio','Okazaki fragments are joined together by:','DNA ligase',['DNA polymerase I','Helicase','Primase'],'Ligase seals nicks between fragments on the lagging strand after the RNA primers are replaced.','Polymerase I removes primers and fills gaps; ligase makes the final bond.',1,'NUCLEIC'],
['bio','The enzyme that synthesises the RNA primer during DNA replication is:','Primase',['Topoisomerase','DNA ligase','Telomerase'],'Primase is a specialised RNA polymerase that lays down short primers for DNA polymerase.','DNA polymerase cannot start a new strand without a primer.',1,'NUCLEIC'],
['bio','Which set of clotting factors is vitamin K dependent?','II, VII, IX, X',['I, V, VIII, XIII','III, IV, XI, XII','V, VIII, XI, XIII'],'Gamma-carboxylation of glutamate residues in factors II, VII, IX, X (and proteins C and S) needs vitamin K.','Factor VIII is not vitamin K dependent.',1,'VITAMINS'],
['bio','Dermatitis, diarrhoea and dementia are features of deficiency of:','Niacin',['Thiamine','Riboflavin','Pyridoxine'],'Pellagra results from niacin (or tryptophan) deficiency; tryptophan is a precursor of niacin.','Thiamine deficiency causes beriberi and Wernicke encephalopathy.',1,'VITAMINS'],
['bio','Which marker is the most specific for myocardial injury?','Cardiac troponin',['Myoglobin','CK-MB','LDH'],'Cardiac troponin I/T are highly specific; myoglobin rises earliest but is not specific.','CK-MB is useful for detecting re-infarction because it falls quickly.',2,'CLINICAL'],
['path','Which of these is NOT a component of Virchow\'s triad?','Hypertension',['Stasis of blood flow','Endothelial injury','Hypercoagulability'],'Virchow\'s triad of thrombosis is endothelial injury, abnormal blood flow (stasis/turbulence) and hypercoagulability.','Hypertension is a risk factor for vascular disease but not part of the triad.',1,'Hemodynamic'],
['path','Which gene is called the "guardian of the genome"?','TP53',['RB1','MYC','RAS'],'p53 halts the cell cycle at G1/S for DNA repair or triggers apoptosis if damage is irreparable.','RB1 also controls G1/S but is not called the guardian of the genome.',1,'Neoplasia'],

['path','Aschoff bodies are characteristic of:','Rheumatic heart disease',['Infective endocarditis','Dilated cardiomyopathy','Kawasaki disease'],'They are granulomas with Anitschkow (caterpillar) cells and fibrinoid necrosis in rheumatic carditis.','Infective endocarditis shows vegetations with organisms, not Aschoff bodies.',1,'CARDIOVASCULAR'],

['path','Mallory–Denk bodies are seen in:','Alcoholic hepatitis',['Haemochromatosis','Wilson disease only','Viral hepatitis A'],'They are eosinophilic cytoplasmic inclusions of damaged keratin filaments in hepatocytes; also seen in some other chronic liver diseases.','Their presence is typical but not exclusive to alcohol injury.',2,'HEPATOBILIARY'],

['pharm','Which drug follows zero-order kinetics at therapeutic doses?','Phenytoin',['Penicillin','Digoxin','Amoxicillin'],'Phenytoin metabolism saturates within the therapeutic range, so small dose increases cause disproportionate rises in level. Alcohol and high-dose aspirin behave similarly.','Most drugs follow first-order kinetics.',2,'GENERAL'],

/* ================= LOGIC: PROGRESS, MASTERY, REVISION ================= */
const prog=t=>S.prog[t.id]||{};
function P(t){return S.prog[t.id]||(S.prog[t.id]={})}
const practiceAtt=()=>S.attempts.filter(a=>a.mode!=='mock');
const attTid=a=>a.tid||QLT[a.q]||null;
function mcqOK(t){const p=prog(t);if((p.acc||0)>=S.settings.masteryAcc)return true;const a=tAcc(t);return a.n>=5&&a.acc*100>=S.settings.masteryAcc}
function revDone(t){return(prog(t).revStage||0)>=1}
function status(t){const p=prog(t);if(p.fp&&p.un&&p.ar&&mcqOK(t)&&revDone(t))return'Mastered';if(p.fp&&p.un&&p.ar&&mcqOK(t))return'Revision pending';if(p.fp&&p.un&&p.ar)return'Ready for MCQs';if(p.fp&&p.un)return'Ready for recall';if(p.fp)return'Learned · explain it next';if(p.learn||(S.sub&&t.subs.some(s=>S.sub[s.id])))return'Learning';return'Not started'}
function nextStep(t){const p=prog(t);return!p.fp?'fp':!p.un?'un':!p.ar?'ar':!mcqOK(t)?'mcq':null}
function tscore(t){const p=prog(t);return((p.fp?1:0)+(p.un?1:0)+(p.ar?1:0)+(mcqOK(t)?1:0)+(revDone(t)?1:0))/5}
function subDone(t){return t.subs.filter(s=>S.sub[s.id]).length}
function sstat(sid){const ts=TOPICS.filter(t=>t.sid===sid);const m=ts.filter(t=>status(t)==='Mastered').length;const at=practiceAtt().filter(a=>a.sid===sid);return{tot:ts.length,m,prog:ts.length?ts.reduce((a,t)=>a+tscore(t),0)/ts.length:0,n:at.length,acc:at.length?at.filter(a=>a.ok).length/at.length:null}}
function overall(){return TOPICS.length?TOPICS.reduce((a,t)=>a+tscore(t),0)/TOPICS.length:0}
function rcStat(t){const l=RCBY[t.id]||[];let ok=0,bad=0;l.forEach(r=>{const s=S.rc[r.id];if(s){ok+=s.ok||0;bad+=s.bad||0}});return{n:l.length,ok,bad}}
/* ---- performance cache, weakness intelligence, revision queue (v3) ---- */
let perfV=0,perfC=null,perfK='';
function perfMap(){const k=perfV+'|'+S.attempts.length+'|'+S.imgAtt.length;if(perfC&&perfK===k)return perfC;const m={};const g=id=>m[id]||(m[id]={n:0,ok:0,rb:0,ro:0,fg:0,hd:0,in:0,iok:0});
 S.attempts.forEach(a=>{const id=attTid(a);if(!id)return;const x=g(id);x.n++;if(a.ok)x.ok++});
 S.imgAtt.forEach(a=>{if(!a.tid)return;const x=g(a.tid);x.in++;if(a.ok)x.iok++});
 RCU.forEach(r=>{if(!r.tid)return;const s=S.rc[r.id];if(!s)return;const x=g(r.tid);x.rb+=s.bad||0;x.ro+=s.ok||0});
 TOPICS.forEach(t=>{const l=(S.prog[t.id]||{}).revLog;if(!l)return;const x=g(t.id);l.slice(-6).forEach(e=>{if(e.r==='forgot')x.fg++;else if(e.r==='hard')x.hd++})});
 perfC=m;perfK=k;return m}
function tAcc(t){const x=perfMap()[t.id];return{n:x?x.n:0,acc:x&&x.n?x.ok/x.n:null}}
function weakScore(t){const p=prog(t),x=perfMap()[t.id];let s=p.weak?4:0;if(x){if(x.n>=3)s+=(1-x.ok/x.n)*10*Math.min(1,x.n/6);if(x.in>=2)s+=(1-x.iok/x.in)*6*Math.min(1,x.in/4);s+=Math.min(5,Math.max(0,x.rb-x.ro));s+=x.fg*2+x.hd}return s}
function isWeak(t){return weakScore(t)>=3}
function weakInfo(){const ts=TOPICS.map(t=>({t,s:weakScore(t)})).filter(x=>x.s>=3).sort((a,b)=>b.s-a.s),pm=perfMap();
 const subj=SUBJ.map(s=>{const st=sstat(s.id),w=ts.filter(x=>x.t.sid===s.id).length;return{s,acc:st.acc,n:st.n,w,sc:w*2+(st.n>=5&&st.acc!=null?(1-st.acc)*10:0)}}).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,5);
 const forgot=TOPICS.filter(t=>{const x=pm[t.id];return x&&(x.fg>=2||x.rb>=3)}).sort((a,b)=>weakScore(b)-weakScore(a)).slice(0,10);
 const wq={};S.attempts.forEach(a=>{if(!a.ok)wq[a.q]=(wq[a.q]||0)+1});
 const rep=Object.entries(wq).filter(e=>e[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,10).map(e=>({q:QB.find(x=>x.id===e[0]),n:e[1]})).filter(x=>x.q);
 const wi={};S.imgAtt.forEach(a=>{if(!a.ok)wi[a.id]=(wi[a.id]||0)+1});
 const repImg=Object.entries(wi).filter(e=>e[1]>=2).map(e=>({q:allImgQ().find(x=>x.id===e[0]),n:e[1]})).filter(x=>x.q).slice(0,5);
 const now=ts.filter(x=>prog(x.t).fp&&(!prog(x.t).due||prog(x.t).due<=today())).slice(0,10).map(x=>x.t);
 return{top:ts.slice(0,10),subj,forgot,rep,repImg,now}}
function revQueue(){const d=today(),W=[],D=[],R=[];
 TOPICS.forEach(t=>{const p=prog(t);if(!p.fp)return;const due=p.due&&p.due<=d;
  if(isWeak(t)&&(due||!p.last||diff(p.last,d)>=2))W.push(t);
  else if(due)D.push(t);
  else if(!p.lastRapid||diff(p.lastRapid,d)>=7){if(!p.due||diff(d,p.due)<=14)R.push(t)}});
 const pr=t=>'ABCD'.indexOf(t.pr);
 W.sort((a,b)=>weakScore(b)-weakScore(a));D.sort((a,b)=>(prog(a).due||'').localeCompare(prog(b).due||'')||pr(a)-pr(b));R.sort((a,b)=>pr(a)-pr(b)||(prog(a).due||'9').localeCompare(prog(b).due||'9'));
 return{weak:W,daily:D,rapid:R}}
function dueList(){const q=revQueue();return q.weak.concat(q.daily)}
function rapidDone(tid){const p=P(T(tid));p.lastRapid=today();(p.revLog=p.revLog||[]).push({d:today(),r:'rapid'});logEv('rev',tid);markActive();save();checkAch()}
/* ---- notes ---- */
const NTYPES=[['quick','Quick note'],['fact','Important fact'],['confusing','Confusing concept'],['mistake','Personal mistake']];
function migNotes(s){Object.keys(s.prog||{}).forEach(id=>{const p=s.prog[id];if(p&&p.note&&!s.notes.some(n=>n.id==='legacy-'+id))s.notes.push({id:'legacy-'+id,tid:id,type:'quick',text:p.note,ts:Date.now(),bm:false})})}
const scratch=tid=>(S.notes.find(n=>n.id==='legacy-'+tid)||{}).text||'';
function setScratch(tid,text){const i=S.notes.findIndex(n=>n.id==='legacy-'+tid);if(!text.trim()){if(i>=0)S.notes.splice(i,1)}else if(i>=0)S.notes[i].text=text;else S.notes.push({id:'legacy-'+tid,tid,type:'quick',text,ts:Date.now(),bm:false});save()}
const notesOf=tid=>S.notes.filter(n=>n.tid===tid).sort((a,b)=>b.ts-a.ts);
/* ---- image questions ---- */
const IMG_CATS=['Histopathology','Radiology','ECG','Dermatology','Ophthalmology','Microbiology','Anatomy','Instruments','Clinical photographs','Graphs and curves'];
var IMGQ=[];
const STOPW=new Set(['image','images','showing','shows','with','from','that','this','there','case','findings','seen','typical','classic','pattern','sign','which','what','most','likely','diagnosis','patient','following','been','have','also','used','test','type']);
const toks=s=>new Set(String(s).toLowerCase().replace(/[^a-z0-9 ]+/g,' ').split(' ').filter(w=>w.length>3&&!STOPW.has(w)));
function imgCat(r){const x=(r[2]+' '+r[3]).toLowerCase();
 if(/\becg\b|ekg|qrs|st[- ]segment|t wave|p wave/.test(x))return'ECG';
 if(/x-ray|xray|radiograph|\bct\b|\bmri\b|usg|ultrasound|barium|angiogra|mammogra|\bhsg\b|\bivp\b|\bpet\b|scan\b/.test(x))return'Radiology';
 if(/instrument|forceps|speculum|retractor|clamp|catheter|cannula|needle|laryngoscope|trocar/.test(x))return'Instruments';
 if(/graph|curve|loop|waveform|trace/.test(x))return'Graphs and curves';
 if(/histolog|histopath|biopsy|stain|microscop|smear|cytolog|section/.test(x))return'Histopathology';
 return({micro:'Microbiology',derm:'Dermatology',oph:'Ophthalmology',anat:'Anatomy'})[r[0]]||'Clinical photographs'}
function buildImgQ(){const tk={};TOPICS.forEach(t=>{t._tok=null});
 IMGQ=DATA.IMG.map((r,i)=>{const q=toks(r[2]+' '+r[3]);let best=null,bs=0,second=0;
  TOPICS.forEach(t=>{if(t.sid!==r[0])return;if(!t._tok)t._tok=toks(t.name+' '+t.chapters.join(' ')+' '+t.subs.map(s=>s.name).join(' '));let n=0;q.forEach(w=>{if(t._tok.has(w))n++});if(n>bs){second=bs;bs=n;best=t}else if(n>second)second=n});
  return{id:'t'+i,sid:r[0],cat:imgCat(r),q:r[2],a:r[3],exp:'',exams:r[4],text:true,tid:bs>=2&&bs>second?best.id:null}})}
const allImgQ=()=>{if(!IMGQ.length)buildImgQ();return IMGQ.concat(S.imgq.map(q=>Object.assign({text:false},q)))};
function imgPerf(tid){const l=S.imgAtt.filter(a=>a.tid===tid);return{n:l.length,ok:l.filter(a=>a.ok).length}}
/* ---- phases ---- */
const PHASE_DEF=[{n:'Foundation',new:65,rev:20,mcq:15},{n:'Consolidation',new:45,rev:30,mcq:25},{n:'Intensive Revision',new:20,rev:45,mcq:35},{n:'Examination Preparation',new:5,rev:45,mcq:50}];
function phase(){const st=S.settings,n=cd();let i;const pm=st.phaseMode;
 if(pm!=='auto'&&pm!=null&&+pm>=0&&+pm<=3)i=+pm;else if(n==null||n<0)i=0;else{const[a,b,c]=st.phaseDays;i=n>a?0:n>b?1:n>c?2:3}
 const base=st.phaseMix[i]||PHASE_DEF[i];let nw=base.new,rv=base.rev,mq=base.mcq;
 const learned=TOPICS.filter(t=>prog(t).fp).length/Math.max(1,TOPICS.length);let adj='';
 if(i>=2&&learned<.3){const m=Math.max(0,Math.min(15,rv+mq-20));nw+=m;rv-=Math.round(m/2);mq-=m-Math.round(m/2);if(m)adj='Many topics are still unlearned, so a little more time goes to new learning.'}
 else if(i<=1&&learned>.8){nw=Math.max(5,nw-10);rv+=10;adj='Most topics are learned, so more time goes to revision.'}
 const tot=nw+rv+mq||1;return{i,t:base.n,new:nw/tot,rev:rv/tot,mcq:mq/tot,adj,d:Math.round(nw/tot*100)+'% new learning · '+Math.round(rv/tot*100)+'% revision · '+Math.round(mq/tot*100)+'% practice'}}
/* ---- recommendations ---- */
const focusToday=()=>Math.round(S.sessions.filter(s=>s.d===today()).reduce((a,s)=>a+s.min,0));
function availMin(){const pl=S.plans[today()];return Math.max(0,(pl?pl.hours:S.settings.hours)*60-focusToday())}
function recs(){const rq=revQueue(),av=availMin(),out=[];let lt=null,ls=null;
 if(S.resume&&T(S.resume.tid)&&nextStep(T(S.resume.tid))){lt=T(S.resume.tid);ls=nextStep(lt)}
 else{const st=TOPICS.filter(t=>nextStep(t)&&(prog(t).fp||prog(t).learn||subDone(t))).sort((a,b)=>'ABCD'.indexOf(a.pr)-'ABCD'.indexOf(b.pr)||tscore(b)-tscore(a))[0];if(st){lt=st;ls=nextStep(st)}else{const r=rankTopics(1)[0];if(r){lt=r.t;ls=r.st}}}
 if(lt)out.push({k:'learn',emo:'📖',title:((prog(lt).fp||prog(lt).learn)?'Continue: ':'Start: ')+lt.name,sub:STEPL[ls].split(' · ')[0]+' · about '+(av&&av<30?15:25)+' min',tid:lt.id,step:ls});
 const rl=rq.weak[0]||rq.daily[0]||rq.rapid[0],n=rq.weak.length+rq.daily.length;
 if(rl)out.push({k:'rev',emo:'🔁',title:'Revise: '+rl.name,sub:(n?n+' ready':'A quick rapid pass')+' · about 10 min',tid:rl.id,cat:rq.weak[0]?'weak':rq.daily[0]?'daily':'rapid'});
 else out.push({k:'rev',ph:true,emo:'🔁',title:'Revision appears after your first topic',sub:'Finish one first pass and it shows up here'});
 const nq=av&&av<25?5:10;out.push({k:'mcq',emo:'✏️',title:nq+' practice questions',sub:weakSubjects().size?'Focused on your weaker subjects':'A short, easy-going set',n:nq});
 return out}
function nextRec(){const r=recs().filter(x=>!x.ph);if(!r.length)return null;const av=availMin();
 const order=(av&&av<25)?['mcq','rev','learn']:(({learn:['rev','mcq','learn'],rev:['mcq','learn','rev'],mcq:['learn','rev','mcq']})[S.lastRec]||(S.resume?['learn','rev','mcq']:['rev','learn','mcq']));
 for(const k of order){const x=r.find(y=>y.k===k);if(x)return x}return r[0]}
function runRec(x){if(x.ph){const l=recs().find(y=>y.k==='learn');if(l)x=l;else return}S.lastRec=x.k;save();if(x.k==='mcq')return startQuiz(buildIds({n:x.n,src:'weak'}),'plan');return openTopic(x.tid,null,x.k==='rev'?'revise':null)}
function freshTask(){const list=[],seen=new Set(),add=(tid,step)=>{if(tid&&!seen.has(tid)&&T(tid)){seen.add(tid);list.push({tid,step})}};
 if(S.resume)add(S.resume.tid,S.resume.step);const rq=revQueue();rq.daily.slice(0,2).forEach(t=>add(t.id,'rev'));rq.weak.slice(0,1).forEach(t=>add(t.id,'rev'));rankTopics(3).forEach(x=>add(x.t.id,x.st));
 return list.length?list[(ui.freshSkip||0)%list.length]:null}

function weakSubjects(){const s=new Set(S.weakSubj);SUBJ.forEach(x=>{const st=sstat(x.id);if(st.n>=5&&st.acc<.65)s.add(x.id);if(TOPICS.filter(t=>t.sid===x.id&&prog(t).weak).length>=2)s.add(x.id)});return s}
function logEv(type,tid){S.log.push({d:today(),t:type,id:tid});if(S.log.length>6000)S.log.splice(0,600)}
function syncTasks(tid,step){const pl=S.plans[today()];if(pl)pl.tasks.forEach(k=>{if(k.tid===tid&&k.step===step&&!k.done)k.done=true})}
function setStep(tid,step,val){const t=T(tid),p=P(t);const before=p[step];p[step]=val;if(val)p.learn=true;
 if(step==='fp'&&val&&before!==true&&p.revStage==null){p.revStage=0;p.due=addDays(today(),S.settings.intervals[0]||1)}
 if(val&&!before){logEv('step',tid);markActive();syncTasks(tid,step)}
 const ns=nextStep(t);S.resume=ns?{tid,step:ns,ts:Date.now()}:(S.resume&&S.resume.tid===tid?null:S.resume);save();checkAch()}
function setAcc(tid,v){const t=T(tid),p=P(t);p.acc=Math.max(0,Math.min(100,+v||0));p.learn=true;if(mcqOK(t)){logEv('step',tid);markActive();syncTasks(tid,'mcq')}const ns=nextStep(t);if(S.resume&&S.resume.tid===tid)S.resume=ns?{tid,step:ns,ts:Date.now()}:null;save();checkAch()}
function tickSub(id,val){const s=SBY[id];if(val){S.sub[id]=1;const p=P(T(s.tid));p.learn=true;logEv('sub',s.tid);markActive();p.resume=null}else delete S.sub[id];save();checkAch()}
function rateRev(tid,r){const t=T(tid),p=P(t),iv=S.settings.intervals;let st=p.revStage||0,days;
 if(r==='forgot'){st=Math.max(0,st-2);p.weak=true;days=1}
 else if(r==='hard'){p.weak=true;days=Math.max(1,Math.round((iv[Math.min(st,iv.length-1)]||1)/2))}
 else{st=st+1;p.weak=false;days=iv[Math.min(st,iv.length-1)]||30;if(r==='easy')days=Math.round(days*1.5)}
 p.revStage=st;p.due=addDays(today(),days);p.last=today();(p.revLog=p.revLog||[]).push({d:today(),r});logEv('rev',tid);markActive();
 const pl=S.plans[today()];if(pl)pl.tasks.forEach(k=>{if(k.tid===tid&&k.type==='rev')k.done=true});save();checkAch();return days}
function streak(){let d=today(),n=0;if(!S.activity[d]&&!S.paused[d])d=addDays(d,-1);while(n<3000){if(S.activity[d])n++;else if(!S.paused[d])break;d=addDays(d,-1)}return n}
function longest(){const k=Object.keys(S.activity).sort();if(!k.length)return 0;let best=0,cur=0,d=k[0];const end=today();while(d<=end){if(S.activity[d]){cur++;best=Math.max(best,cur)}else if(!S.paused[d])cur=0;d=addDays(d,1)}return best}
function weekActive(){const f=addDays(today(),-6);return Object.keys(S.activity).filter(d=>d>=f).length}

/* ================= PLANNING ENGINE ================= */
function genPlan(H,mode){mode=mode===true?'light':(!mode?'normal':mode);const date=today(),M=Math.round(H*60),old=S.plans[date];
 const keep=old?old.tasks.filter(t=>t.done||t.type==='custom'):[];const have=new Set(keep.map(t=>t.type+'|'+(t.tid||'')+'|'+(t.step||'')));
 const cap=mode==='light'?Math.min(M,60):M;let budget=Math.max(0,cap-keep.filter(t=>t.type!=='break').reduce((a,t)=>a+t.min,0));
 const mk=o=>Object.assign({id:uid(),done:false},o),work=[],skip=new Set(keep.map(t=>t.tid).filter(Boolean));
 const rq=revQueue(),pool=rq.weak.concat(rq.daily).filter(t=>!have.has('rev|'+t.id+'|'));
 const revTask=t=>mk({type:'rev',tid:t.id,sid:t.sid,min:10,title:'Revise: '+t.name});
 if(mode==='light'){
  let left=budget;pool.concat(rq.rapid.filter(t=>!have.has('rev|'+t.id+'|'))).slice(0,Math.min(3,Math.floor(left*.5/10))).forEach(t=>{work.push(revTask(t));left-=10});
  const wc=left>=10?TOPICS.filter(t=>(RCBY[t.id]||[]).length&&prog(t).fp&&!have.has('recall|'+t.id+'|')).sort((a,b)=>(isWeak(b)?1:0)-(isWeak(a)?1:0))[0]:null;
  if(wc){work.push(mk({type:'recall',tid:wc.id,sid:wc.sid,min:10,count:10,title:'Quick recall cards: '+wc.name}));left-=10}
  if(left>=10)work.push(mk({type:'mcq',min:Math.min(15,left),count:10,title:'10 easy-going MCQs'}));
 }else if(mode==='catch'){
  const started=TOPICS.filter(t=>nextStep(t)&&(prog(t).learn||prog(t).fp||subDone(t))&&!skip.has(t.id)).sort((a,b)=>'ABCD'.indexOf(a.pr)-'ABCD'.indexOf(b.pr)||tscore(b)-tscore(a));
  const revN=Math.min(pool.length,Math.floor(budget*.25/10)),mcqMin=budget>=90?15:0;
  pool.slice(0,revN).forEach(t=>work.push(revTask(t)));
  let R=Math.max(0,budget-revN*10-mcqMin);const n=Math.min(started.length||0,Math.max(R>=20?1:0,Math.floor(R/25)));const dur=n?Math.max(15,Math.round(R/n/5)*5):0;
  let list=started.slice(0,n).map(t=>({t,st:nextStep(t)}));
  if(R>=20&&list.length<1){list=rankTopics(1,skip).filter(x=>x.t.pr==='A'||x.t.pr==='B')}
  list.forEach(x=>work.push(mk({type:'study',tid:x.t.id,sid:x.t.sid,step:x.st,min:Math.min(dur||25,Math.max(15,R)),title:STEPL[x.st]+': '+x.t.name})));
  if(mcqMin)work.push(mk({type:'mcq',min:mcqMin,count:10,title:'10 practice questions'}));
 }else{
  const ph=phase();const rev=pool.slice(0,Math.min(pool.length,Math.floor(budget*ph.rev/10)));
  const errMin=unresolved()?(budget>=180?15:budget>=120?10:0):0,mcqMin=budget>=60?Math.max(15,Math.round(budget*ph.mcq/5)*5):0,brk=Math.floor(budget/100);
  let R=Math.max(0,budget-rev.length*10-errMin-mcqMin-brk*10);
  const n=R>=15?Math.max(1,Math.round(R/45)):0,dur=n?Math.max(15,Math.round(R/n/5)*5):0;
  rev.forEach(t=>work.push(revTask(t)));
  rankTopics(n,new Set([...skip,...rev.map(t=>t.id)])).forEach(x=>{if(!have.has('study|'+x.t.id+'|'+x.st))work.push(mk({type:'study',tid:x.t.id,sid:x.t.sid,step:x.st,min:dur,title:STEPL[x.st]+': '+x.t.name}))});
  if(mcqMin)work.push(mk({type:'mcq',min:mcqMin,count:Math.min(60,Math.min(QB.length,Math.max(10,Math.round(mcqMin/1.5/5)*5))),title:'MCQ practice'}));
  if(errMin)work.push(mk({type:'err',min:errMin,title:'Error notebook review'}));
 }
 /* fit to the available time: never exceed it */
 const sum=a=>a.reduce((s,x)=>s+x.min,0);
 for(let g=0;g<60&&sum(work)>budget;g++){const over=sum(work)-budget,ty=work.map(x=>x.type);const st=work.filter(x=>x.type==='study'&&x.min>15).pop();if(st){st.min=Math.max(15,st.min-over);continue}
  const j=Math.max(ty.lastIndexOf('study'),ty.lastIndexOf('mcq'),ty.lastIndexOf('recall'),ty.lastIndexOf('err'));work.splice(j>=0?j:work.length-1,1)}
 const tasks=[];let acc=0;work.forEach((w,i)=>{tasks.push(w);acc+=w.min;if(mode!=='light'&&acc>=90&&i<work.length-1){tasks.push(mk({type:'break',min:10,title:'Break — stretch, water, breathe'}));acc=0}});
 const seen=new Set(),final=keep.concat(tasks).filter(t=>{if(t.type==='break'||t.type==='custom'||t.done)return true;const k=t.type+'|'+(t.tid||'')+'|'+(t.step||'');if(seen.has(k))return false;seen.add(k);return true});
 S.plans[date]={hours:H,mode,low:mode==='light',tasks:final,gen:Date.now()};S.settings.hours=H;save()}

function rankTopics(n,skip){const rs=S.resume,w=weakSubjects(),cnt={},out=[];
 const cover={};SUBJ.forEach(s=>cover[s.id]=sstat(s.id).prog);
 let c=TOPICS.map(t=>{const st=nextStep(t);if(!st||(skip&&skip.has(t.id)))return null;const p=prog(t);let s={A:40,B:30,C:20,D:10}[t.pr]||10;s+=Math.min(10,t.ev.tag);if(p.learn||p.fp||p.un||p.ar)s+=15;if(w.has(t.sid))s+=8;if(isWeak(t))s+=6;s+=(1-cover[t.sid])*5;if(rs&&rs.tid===t.id)s+=100;return{t,st,s:s+Math.random()*5}}).filter(Boolean).sort((a,b)=>b.s-a.s);
 let last=null;while(out.length<n&&c.length){let i=c.findIndex(x=>x.t.sid!==last&&(cnt[x.t.sid]||0)<2);if(i<0)i=0;const x=c.splice(i,1)[0];out.push(x);last=x.t.sid;cnt[last]=(cnt[last]||0)+1}return out}
const unresolved=()=>Object.values(S.errors).filter(e=>!e.resolved).length;
const goodCard=r=>{const q=r.q||'',a=r.a||'';const al=x=>(x.match(/[A-Za-z0-9 ,.()'/%+-]/g)||[]).length/(x.length||1);return q.length>=14&&q.length<=240&&a.length>=2&&a.length<=160&&al(q)>.93&&al(a)>.9&&!/[|_~^<>{}\\]/.test(q+a)&&(q.match(/[A-Za-z]{3,}/g)||[]).length>=3};
function recallDeck(tid,n){let l=(RCBY[tid]||[]).filter(goodCard);l.sort((a,b)=>{const x=S.rc[a.id]||{},y=S.rc[b.id]||{};return(y.bad||0)-(x.bad||0)||(x.ok||0)-(y.ok||0)});return l.slice(0,n).map(r=>r.id)}
function nextAction(){const pl=S.plans[today()];
 if(S.resume&&T(S.resume.tid)){const t=T(S.resume.tid);return{emo:sOf(t).emo,title:t.name,sub:'Pick up where you left off · '+STEPL[S.resume.step],btn:'Continue',run:()=>openTopic(t.id)}}
 const k=pl&&pl.tasks.find(x=>!x.done&&x.type!=='break');
 if(k){const t=k.tid?T(k.tid):null;return{emo:t?sOf(t).emo:'📝',title:k.title,sub:'Next in today\'s plan · '+k.min+' min',btn:'Start',run:()=>runTask(k)}}
 const d=dueList()[0];if(d)return{emo:sOf(d).emo,title:d.name,sub:'A gentle revision is ready',btn:'Revise',run:()=>openTopic(d.id)};
 const r=rankTopics(1)[0];if(r)return{emo:sOf(r.t).emo,title:r.t.name,sub:'Suggested next · '+STEPL[r.st],btn:'Begin',run:()=>openTopic(r.t.id)};
 return null}

function startQuiz(ids,mode){if(!ids.length){toast('No questions match that yet.');return}qz={ids,i:0,sel:null,res:[],mode,done:false};ui.tab='practice';ui.sheet=null;render()}
function buildIds(o){let pool=QB.filter(q=>(!o.sid||q.sid===o.sid)&&(!o.tid||QLT[q.id]===o.tid)&&(!o.system||(T(QLT[q.id])||{}).system===o.system)&&(!o.hard||q.d>=3));
 if(o.src==='mistakes')pool=pool.filter(q=>S.errors[q.id]&&!S.errors[q.id].resolved);
 if(o.src==='unseen')pool=pool.filter(q=>!S.attempts.some(a=>a.q===q.id));
 if(o.src==='weak'){const w=weakSubjects();const p2=pool.filter(q=>w.has(q.sid));if(p2.length)pool=p2}
 const seen=id=>S.attempts.filter(a=>a.q===id).length;pool=pool.map(q=>({q,s:seen(q.id)+(S.errors[q.id]&&!S.errors[q.id].resolved?-2:0)+Math.random()})).sort((a,b)=>a.s-b.s).map(x=>x.q);
 return pool.slice(0,Math.min(o.n||10,pool.length)).map(q=>q.id)}

 if(!ok){const e=S.errors[qid]||(S.errors[qid]={type:'Knowledge gap',note:'',bm:false,n:0});e.resolved=false;e.n++;e.ts=Date.now()}else if(mode==='errors'&&S.errors[qid])S.errors[qid].resolved=true}

function addEx(map,exam,yrs){if(!exam)return;(map[exam]=map[exam]||new Set());yrs.forEach(y=>{if(y)map[exam].add(String(y))})}
function parseExamStr(str,map){String(str||'').split(',').forEach(p=>{const m=p.trim().match(/^(NEET PG|INI-CET|FMGE)\s*(\d{4})?/);if(m)addEx(map,m[1],m[2]?[m[2]]:[])})}
function badgesHtml(map){return EXAMS.filter(e=>map[e]&&map[e].size).map(e=>`<span class="eb ${exCls(e)}">${e} ${[...map[e]].sort().join(', ')}</span>`).join('')}
function topicEx(t){const m={};t.subs.forEach(s=>{addEx(m,'INI-CET',s.yrs);s.kids.forEach(k=>addEx(m,'INI-CET',k.yrs))});return m}
function subEx(s){const m={};addEx(m,'INI-CET',s.yrs);s.kids.forEach(k=>addEx(m,'INI-CET',k.yrs));return m}
function evText(t){const e=t.ev;if(!e.total)return'';const ys=Object.entries(e.yrs).sort().map(x=>x[0]+(x[1]>1?'×'+x[1]:'')).join(', ');return`Master PYT: ${e.tag} of ${e.total} subtopics carry INI-CET year tags${ys?' ('+ys+')':''}`}

function matchLabel(label,sidHint){const n=norm(label);if(!n)return{tid:null,status:'unmatched'};
 let hit=TOPICS.filter(t=>(!sidHint||t.sid===sidHint)&&(norm(t.name)===n||t.aliases.some(a=>norm(a)===n)));
 if(hit.length===1)return{tid:hit[0].id,status:'mapped'};
 const ss=SUBS.filter(s=>norm(s.name)===n&&(!sidHint||T(s.tid).sid===sidHint));if(ss.length===1)return{tid:ss[0].tid,status:'mapped'};
 const w=n.split(' ').filter(x=>x.length>2);if(w.length){const c=TOPICS.filter(t=>(!sidHint||t.sid===sidHint)&&w.every(x=>norm(t.name+' '+t.aliases.join(' ')).includes(x)));if(c.length===1)return{tid:c[0].id,status:'review'}}
 return{tid:null,status:'unmatched'}}
